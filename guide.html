<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>使用指南 · SE Workflow</title><link rel="stylesheet" href="demo/site.css"><body><header><strong>第十二组 / SE Workflow</strong><nav><a href="index.html">项目主页</a><a href="examples.html">规格样例</a><a href="workspace.html">规划工作台</a><a href="guide.html">使用指南</a></nav></header><main><h1>第一次生成计划</h1><article><ol><li>打开<a href="examples.html">规格样例</a>，选择产品后点击「使用此规格」。</li><li>在工作台编辑需求目标和验收条件，保留唯一的需求编号。</li><li>设置并发数并点击「生成计划」。离线规则为每条需求生成实现与验证任务。</li><li>把并发数从 2 改为 1，重新生成并比较批次数。</li><li>点击「导出 JSON」保存当前计划。离开工作台前请先导出需要保留的结果。</li></ol></article></main></body></html>
