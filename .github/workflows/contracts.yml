name: contracts

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

jobs:
  contracts:
    name: 契约与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schema 与模型导出一致
        run: python -m backend.app.contracts.export_schema --check

      - name: 派生 fixture 最新
        run: python -m backend.tools.build_fixtures --check

      - name: 契约与校验测试
        run: python -m unittest discover -s backend/tests -t . -v
